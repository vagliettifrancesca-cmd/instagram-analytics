name: Sync dati Instagram (Meta API)

# Gira automaticamente il 1° di ogni mese alle 9:00 UTC.
# Può essere avviato a mano da GitHub → Actions → "Run workflow".
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessario per fare push del mockData.ts aggiornato

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizza dati Meta Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/sync-meta.js

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name  "Deeva Bot"
          git config user.email "bot@deeva.it"
          git add src/data/mockData.ts
          if git diff --staged --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "chore: sync dati Instagram $(date +%Y-%m)"
            git push
          fi
